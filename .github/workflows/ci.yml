name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jvm-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the independent Maven Central consumer without Android SDK configuration
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew -p integration/jvm-consumer test run --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-consumer-test-results
          path: integration/jvm-consumer/build/test-results/
          retention-days: 7
  jvm-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: python3 scripts/generate_rules.py --check
      - name: Test JVM, Android and demo
        run: ./gradlew :dateparser:jvmTest :dateparser:testAndroidHostTest :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Publish unsigned local variants
        run: ./gradlew :dateparser:publishKotlinMultiplatformPublicationToTestRepository :dateparser:publishJvmPublicationToTestRepository :dateparser:publishAndroidPublicationToTestRepository -PlocalPublication=true
      - run: python3 scripts/check_publication.py build/test-repository
      - name: Resolve from separate KMP consumer
        run: ./gradlew -p integration/consumer jvmTest testAndroidHostTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-android-test-results
          path: |
            dateparser/build/test-results/
            app/build/test-results/
            integration/consumer/build/test-results/
          retention-days: 7
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Test iOS simulator and compile device library
        run: ./gradlew :dateparser:iosSimulatorArm64Test :dateparser:compileKotlinIosArm64 --stacktrace
      - name: Publish complete unsigned KMP artifact set
        run: ./gradlew :dateparser:publishAllPublicationsToTestRepository -PlocalPublication=true --stacktrace
      - run: python3 scripts/check_publication.py build/test-repository --native
      - name: Consume published iOS variants
        run: ./gradlew -p integration/consumer iosSimulatorArm64Test --stacktrace
      - name: Test the SwiftUI host against Maven Central
        run: bash scripts/test_ios_demo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-kmp-test-repository
          path: build/test-repository
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-test-results
          path: |
            dateparser/build/test-results/
            integration/consumer/build/test-results/
            integration/ios-app/build/*.xcresult/
          retention-days: 7
